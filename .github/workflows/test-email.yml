name: Send test email

on:
  workflow_dispatch:
    inputs:
      menu_date:
        description: "Menu date (YYYY-MM-DD); leave blank for tomorrow in Eastern Time"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: lunch-menu-email-test
  cancel-in-progress: false

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check email behavior
        run: python -m unittest discover -s tests -v
      - name: Send one test email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          MENU_DATE: ${{ inputs.menu_date }}
        run: |
          if [ -n "$MENU_DATE" ]; then
            python notify.py --date "$MENU_DATE" --test --send
          else
            python notify.py --test --send
          fi
